---
- name: Build POST payload
  ansible.builtin.set_fact:
    fact_inventory_gather_api_payload:
      agent_facts:
        ansible_version: "{{ ansible_version }}"
        url: "{{ fact_inventory_gather_api_url }}"
      system_facts: >-
        {{
          ansible_facts
          | dict2items
          | rejectattr('key', 'in', ['ansible_local', 'packages'])
          | items2dict
        }}
      package_facts: "{{ ansible_facts.packages | default({}) }}"
      local_facts: "{{ ansible_facts.ansible_local | default({}) }}"
  no_log: "{{ act_inventory_gather_no_log | bool }}"
