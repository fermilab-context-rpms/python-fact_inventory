# Gather system facts and submit to fact_inventory API
#
# Purpose:
#   - Collects system, package, and local facts from the target host
#   - Submits the collected data to the fact_inventory API for centralized tracking
#   - Writes an optional audit copy of the payload and API response (best-effort, non-fatal)
#
# Requirements:
#   - ansible >= 2.10
#   - Python 3 on target system
#   - Network access to the fact_inventory API server (default: http://127.0.0.1:8000)
#   - Root privileges (typically via -K for become password prompt) for detailed facts
#
# Usage examples:
#   # Gather facts locally with privilege escalation
#   ansible-playbook -K -i 'localhost,' -c local gather.yml
#
#   # Target remote API server
#   ansible-playbook -K -e 'api_server=https://fqdn' gather.yml
#
#   # Load custom variables from file
#   ansible-playbook -K -e '@override_vars.yml' gather.yml
#
# Exit behavior:
#   - Exits with non-zero if API submission fails (status code != 201)
#   - Audit logging failures do not affect exit code (non-fatal by design)
#
# To review the submitted results:
#   - Check the local audit log at /var/log/fact-inventory-payload.json (if enabled)
#   - Contact your fact-inventory service administrator for centralized query access
#
- name: Gather facts on system
  hosts: all
  gather_facts: no # gather with custom logic below
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_package_manager: auto
    custom_fact_path: /etc/ansible/facts.d

    api_server: http://127.0.0.1:8000
    base_url: /fact_inventory
    api_target: /api/v1/facts
    api_url: "{{ api_server }}{{ base_url }}{{ api_target }}"

    audit_file_create: false
    audit_file_owner: root
    audit_file_group: root
    audit_file_mode: "0644"
    audit_file_create_directory: true
    audit_file_directory_owner: root
    audit_file_directory_group: root
    audit_file_directory_mode: "0755"

    audit_file: /var/log/fact-inventory-payload.json

  tasks:
    - name: Fact Collection
      block:
        - name: Gather ansible system facts
          become: true
          ansible.builtin.setup:
            gather_subset:
              - "all"
              - "!facter"
              - "!ohai"
            fact_path: "{{ custom_fact_path }}"

        - name: Gather the package facts
          ansible.builtin.package_facts:
            manager: "{{ ansible_package_manager }}"

    - name: Payload Preparation
      block:
        - name: Build POST payload
          ansible.builtin.set_fact:
            fact_api_post_payload:
              agent_facts:
                ansible_version: "{{ ansible_version }}"
                url: "{{ api_url }}"
              system_facts: >-
                {{
                  ansible_facts
                  | dict2items
                  | rejectattr('key', 'in', ['ansible_local', 'packages'])
                  | items2dict
                }}
              package_facts: "{{ ansible_facts.packages | default({}) }}"
              local_facts: "{{ ansible_facts.ansible_local | default({}) }}"

    - name: API Submission
      block:
        - name: POST fact_api_post_payload to fact_inventory API
          ansible.builtin.uri:
            url: "{{ api_url }}"
            method: POST
            body_format: json
            body: "{{ fact_api_post_payload | to_nice_json(indent=0) }}"
            status_code: 201
          register: fact_api_post_result
          ignore_errors: true

    - name: Audit Logging
      when: audit_file_create | bool
      block:
        - name: Ensure audit directory exists
          when: audit_file_create_directory | bool
          ansible.builtin.file:
            path: "{{ audit_file | dirname }}"
            state: directory
            owner: "{{ audit_file_directory_owner }}"
            group: "{{ audit_file_directory_group }}"
            mode: "{{ audit_file_directory_mode }}"
          become: true
          failed_when: false

        - name: Write audit file with payload and response
          ansible.builtin.copy:
            dest: "{{ audit_file }}"
            owner: "{{ audit_file_owner }}"
            group: "{{ audit_file_group }}"
            mode: "{{ audit_file_mode }}"
            content: >-
              {{
                {
                  "fact_api_post_payload": fact_api_post_payload,
                  "fact_api_post_result": fact_api_post_result
                } | to_nice_json
              }}
          become: true
          failed_when: false

    - name: Validation
      block:
        - name: Fail if and only if the API call failed
          ansible.builtin.fail:
            msg: "API call failed: {{ fact_api_post_result.msg }}"
          when: fact_api_post_result.failed
