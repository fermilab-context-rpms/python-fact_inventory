# This playbook:
#   collects system, package, and local facts
#   writes an audit copy (best-effort, non-fatal)
#   submits the same payload to the fact_inventory API
#
# Usage:
#   ansible-playbook -K -i localhost, -c local gather.yml
#   ansible-playbook -K -e "api_server=https://fqdn" gather.yml
#   ansible-playbook -K -e "@overide_vars.yml" gather.yml
#
- name: Gather facts on system
  hosts: all
  gather_facts: no # gather with custom logic below
  vars:
    ansible_python_interpreter: /usr/bin/python3
    custom_fact_path: /etc/ansible/facts.d
    api_server: http://127.0.0.1:8000
    base_url: /fact_inventory
    api_target: /api/v1/facts
    api_url: "{{ api_server }}{{ base_url }}{{ api_target }}"
    audit_file_create: false
    audit_file_create_directory: true
    audit_file: /var/log/fact-inventory-payload.json

  tasks:
    - name: Fact Collection
      block:
        - name: Gather ansible system facts
          become: true
          ansible.builtin.setup:
            gather_subset:
              - "all"
              - "!facter"
              - "!ohai"
            fact_path: "{{ custom_fact_path }}"

        - name: Gather the package facts
          ansible.builtin.package_facts:
            manager: auto

    - name: Payload Preparation
      block:
        - name: Build POST payload
          ansible.builtin.set_fact:
            post_payload:
              system_facts: >-
                {{
                  ansible_facts
                  | dict2items
                  | rejectattr('key', 'in', ['ansible_local', 'packages'])
                  | items2dict
                }}
              package_facts: "{{ ansible_facts.packages | default({}) }}"
              local_facts: "{{ ansible_facts.ansible_local | default({}) }}"
              agent_facts:
                ansible_version: "{{ ansible_version }}"
                url: "{{ api_url }}"

    - name: API Submission
      block:
        - name: POST post_payload to fact_inventory API
          ansible.builtin.uri:
            url: "{{ api_url }}"
            method: POST
            body_format: json
            body: "{{ post_payload | to_nice_json(indent=0) }}"
            status_code: 201
          register: api_result
          ignore_errors: true

    - name: Audit Logging
      when: audit_file_create | bool
      block:
        - name: Ensure audit directory exists
          when: audit_file_create_directory | boot
          ansible.builtin.file:
            path: "{{ audit_file | dirname }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          become: true
          failed_when: false

        - name: Write audit file with payload and response
          ansible.builtin.copy:
            dest: "{{ audit_file }}"
            owner: root
            group: root
            mode: "0600"
            content: >-
              {{
                {
                  'data': { 'post_payload': post_payload },
                  'response': { 'api_result': api_result }
                } | to_nice_json
              }}
          become: true
          failed_when: false

    - name: Validation
      block:
        - name: Fail if and only if the API call failed
          ansible.builtin.fail:
            msg: "API call failed: {{ api_result.msg }}"
          when: api_result.failed
