name: CI
permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install uv
      - run: uv sync --group dev
      - run: uv run pre-commit run --all-files

  pytest:
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      matrix:
        python-version:
          - "3.12"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install uv
      - run: uv sync --python ${{ matrix.python-version }} --group dev
      - run: uv run --python ${{ matrix.python-version }} pytest

  ansible-collection-integration:
    runs-on: ubuntu-latest
    needs: pre-commit
    defaults:
      run:
        working-directory: agent/ansible/fact_inventory
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install Ansible and dependencies
        run: pip install ansible
      - name: Run Ansible collection integration tests
        run: ansible-test integration --python-interpreter /usr/bin/python3 --allow-destructive --allow-root
